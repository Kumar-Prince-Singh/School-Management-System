name: CI/CD Pipeline – School Management Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # Stage 1: Backend Testing, Security & Code Quality
  # ============================================================================
  backend-checks:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 3. Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: 4. Code Quality & Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: 5. Execute Acceptance & Unit Tests (Pytest)
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-super-secure
          ENVIRONMENT: testing
        run: |
          pytest backend/tests -v -W ignore::DeprecationWarning

  # ============================================================================
  # Stage 2: Frontend Build & Compilation Validation
  # ============================================================================
  frontend-checks:
    name: Frontend Build & Asset Compilation
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 3. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 4. Compile Production Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  # ============================================================================
  # Stage 3: Containerization & Docker Compose Verification
  # ============================================================================
  docker-checks:
    name: Container Build & Docker Compose Verification
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Build Backend Docker Image with Git SHA Tag
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            algions/school-backend:${{ github.sha }}
            algions/school-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 5. Build Frontend Docker Image with Git SHA Tag
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: |
            algions/school-frontend:${{ github.sha }}
            algions/school-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Build Nginx Reverse Proxy Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          tags: |
            algions/school-nginx:${{ github.sha }}
            algions/school-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 7. Pipeline Completion Notice
        run: |
          echo "===================================================================="
          echo " [CI/CD SUCCESS] All Pipeline Stages Completed Successfully!"
          echo " Commit SHA: ${{ github.sha }}"
          echo " Candidate: Prince Kumar (Reg: 12314718)"
          echo " Company: ALGIONS AI LABS PRIVATE LIMITED"
          echo "===================================================================="

