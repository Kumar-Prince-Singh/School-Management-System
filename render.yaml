
databases:
  - name: school-postgres
    databaseName: school_db
    plan: free
    region: oregon

services:
  - type: web
    name: school-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGIN_REGEX
        value: "^https:\\/\\/.*\\.vercel\\.app$"
